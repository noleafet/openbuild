services:
  sonarqube_db:
    container_name: sonarqube_db
    extends:
      file: ../${DEVOPS_CODE}_${DEVOPS_POSTGRES_15}
      service: postgres_db
    environment:
      POSTGRES_USER: ${SONAR_DB_USER}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD}
      POSTGRES_DB: ${SONAR_DB_NAME}
    networks:
      - shared-network
    ports: !override
      - "${SONAR_DB_HOST_PORT:-5432}:5432"
    volumes:
      - ${VOLUME_DIR}/sonarqube_community_postgres_data:/var/lib/postgresql:Z,U

  sonarqube:
    image: docker.io/library/sonarqube:community
    container_name: sonarqube
    depends_on:
      sonarqube_db:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonarqube_db:5432/${SONAR_DB_NAME}
      - SONAR_JDBC_USERNAME=${SONAR_DB_USER}
      - SONAR_JDBC_PASSWORD=${SONAR_DB_PASSWORD}
    volumes:
      - ${VOLUME_DIR}/sonarqube_community_data:/opt/sonarqube/data:Z,U
      - ${VOLUME_DIR}/sonarqube_community_extensions:/opt/sonarqube/extensions:Z,U
      - ${VOLUME_DIR}/sonarqube_community_logs:/opt/sonarqube/logs:Z,U
    networks:
      - shared-network
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

networks:
  shared-network:
    driver: bridge