services:
  grafana:
    image: docker.io/grafana/grafana:13.2.2-ubuntu
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - ${VOLUME_DIR}/grafana_data:/var/lib/grafana

