global:
  scrape_interval:     15s # How frequently to scrape targets by default
  evaluation_interval: 15s # How frequently to evaluate alerting rules

scrape_configs:
  # ----------------------------------------------------
  # 1. Spring Boot 4 Backend Application
  # ----------------------------------------------------
  - job_name: 'backend'
    metrics_path: '/actuator/prometheus' # The Actuator endpoint
    static_configs:
      # 'host.docker.internal' lets the container connect back to 
      # your Maven-run application on your local machine (port 8080)
      - targets: ['backend:8080']

  # ----------------------------------------------------
  # 2. Next.js Frontend Application
  # ----------------------------------------------------
  - job_name: 'frontend'
    metrics_path: '/api/metrics' # The custom Next.js Route Handler endpoint
    static_configs:
      # Points to your local Next.js development server (port 3000)
      - targets: ['frontend:3000']
